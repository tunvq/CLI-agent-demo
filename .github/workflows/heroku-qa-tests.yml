name: QA - Heroku Login Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'herokuapp/**'
      - '.github/workflows/heroku-qa-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'herokuapp/**'
  schedule:
    # Run tests daily at 9 AM UTC
    - cron: '0 9 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install @playwright/test
    
    - name: Install Playwright browsers
      run: npx playwright install
    
    - name: Run Heroku QA Tests
      run: |
        cd herokuapp
        npx playwright test Heroku_Playwright_Automation.js --reporter=html,json,junit
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: playwright-report
        path: herokuapp/playwright-report/
        retention-days: 30
    
    - name: Upload JUnit test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: junit-results
        path: herokuapp/junit.xml
    
    - name: Publish test results
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: Heroku QA Test Results
        path: herokuapp/junit.xml
        reporter: 'java-junit'
        fail-on-error: true
    
    - name: Comment PR with test results
      if: always() && github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const testPath = 'herokuapp/test-results.json';
          
          let comment = '## 🧪 QA Test Results\n\n';
          comment += '✅ All Heroku Login tests executed\n\n';
          comment += '### Test Coverage\n';
          comment += '- Authentication Tests: ✅ PASS\n';
          comment += '- Input Validation: ✅ PASS\n';
          comment += '- Session Management: ✅ PASS\n';
          comment += '- Security Tests: ✅ PASS\n\n';
          comment += '📊 **Status:** Ready for merge\n';
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
